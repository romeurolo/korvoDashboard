name: Compilar ESPHome
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esphome/build-action@v1
        with:
          configuration: korvo_shelly.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-korvo
          path: .esphome/build/korvo-shelly-gateway/.pioenvs/korvo-shelly-gateway/firmware.factory.bin
