name: Compilar ESPHome
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar e Compilar ESPHome
        run: |
          pip install esphome
          esphome compile korvo_shelly.yaml

      - name: Guardar Firmware (.bin)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-korvo
          path: .esphome/build/korvo-shelly-gateway/.pioenvs/korvo-shelly-gateway/firmware.factory.bin
