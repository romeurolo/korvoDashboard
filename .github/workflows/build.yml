name: Compilar ESP-IDF Korvo-S31
on:
  push:
    paths-ignore:
      - 'firmware/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Target ESP32-S31 e Compilar
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s31 || (cat build/log/idf_py_stderr_output_* && exit 1)
          idf.py build || (cat build/log/idf_py_stderr_output_* && exit 1)
          mkdir -p firmware
          cp build/bootloader/bootloader.bin firmware/bootloader.bin
          cp build/partition_table/partition-table.bin firmware/partition-table.bin
          cp build/korvo_shelly_gateway.bin firmware/korvo_shelly_gateway.bin

      - name: Fazer Commit dos .bin no Repositório
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add firmware/
          git commit -m "Atualizar binarios do firmware" || exit 0
          git push
