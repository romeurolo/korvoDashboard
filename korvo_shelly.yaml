esphome:
  name: korvo-shelly-gateway
  friendly_name: Gateway Shelly H&T

esp32:
  board: esp32-s31-devkitc-1
  variant: esp32s31
  framework:
    type: esp-idf
    version: 6.1.0
    platform_version: 6.1.0

# Bluetooth ativo para ler Shelly H&T Gen3 (BTHome v2 - UUID FCD2) sem Wi-Fi
esp32_ble_tracker:
  scan_parameters:
    active: false
  on_ble_service_data_advertise:
    - service_uuid: FCD2
      then:
        - lambda: |-
            std::string mac = x.address_str();
            // Ignora pacotes encriptados (bit 0 do byte 0)
            if (x.data.size() < 2 || (x.data & 0x01)) return;

            float temp = NAN;
            float hum = NAN;
            float bat = NAN;

            size_t i = 1;
            while (i < x.data.size()) {
              uint8_t obj_id = x.data[i++];
              if (obj_id == 0x01 && i < x.data.size()) { // Bateria (%)
                bat = x.data[i++];
              } else if (obj_id == 0x02 && i + 1 < x.data.size()) { // Temperatura (0.01 C)
                int16_t raw = (int16_t)(x.data[i] | (x.data[i + 1] << 8));
                temp = raw * 0.01f;
                i += 2;
              } else if (obj_id == 0x03 && i + 1 < x.data.size()) { // Humidade (0.01 %)
                uint16_t raw = (uint16_t)(x.data[i] | (x.data[i + 1] << 8));
                hum = raw * 0.01f;
                i += 2;
              } else if (obj_id == 0x00 && i < x.data.size()) { // Packet ID
                i += 1;
              } else {
                break;
              }
            }

            // Atualiza Sensor 1: Sala (Substitua pelo MAC real do Shelly 1)
            if (mac == "AA:BB:CC:DD:EE:01") {
              if (!std::isnan(temp)) id(temp_sala).publish_state(temp);
              if (!std::isnan(hum)) id(hum_sala).publish_state(hum);
              if (!std::isnan(bat)) id(bat_sala).publish_state(bat);
            }
            // Atualiza Sensor 2: Quarto (Substitua pelo MAC real do Shelly 2)
            else if (mac == "AA:BB:CC:DD:EE:02") {
              if (!std::isnan(temp)) id(temp_quarto).publish_state(temp);
              if (!std::isnan(hum)) id(hum_quarto).publish_state(hum);
              if (!std::isnan(bat)) id(bat_quarto).publish_state(bat);
            }

# Barramento I2C para o controlador tátil GT1151 (GPIO50/51 no Korvo-1)
i2c:
  sda: GPIO50
  scl: GPIO51
  scan: true

# Ecrã 4.3" RGB Paralelo (800x480 - Subboard SUB3)
display:
  - platform: rpi_dpi_rgb
    id: meu_ecra
    color_order: RGB
    dimensions:
      width: 800
      height: 480
    pclk_pin: GPIO46
    vsync_pin: GPIO45
    hsync_pin: GPIO44
    de_pin: GPIO43
    data_pins:
      red: [GPIO19, GPIO26, GPIO27, GPIO28, GPIO30]
      green: [GPIO13, GPIO14, GPIO15, GPIO16, GPIO17, GPIO18]
      blue: [GPIO9, GPIO10, GPIO11, GPIO12, GPIO21]
    pclk_frequency: 16MHz
    hsync_back_porch: 40
    hsync_front_porch: 40
    hsync_pulse_width: 48
    vsync_back_porch: 32
    vsync_front_porch: 13
    vsync_pulse_width: 3

# Controlador Tátil GT1151
touchscreen:
  - platform: gt911
    id: meu_toque
    display: meu_ecra

# Temporizador interno offline (grava ponto no histórico a cada 15 minutos)
interval:
  - interval: 15min
    then:
      - if:
          condition:
            lambda: 'return !std::isnan(id(temp_sala).state);'
          then:
            - lvgl.widget.update:
                id: grafico_temp
                series:
                  - id: serie_temp_sala
                    add_value: !lambda 'return id(temp_sala).state;'
      - if:
          condition:
            lambda: 'return !std::isnan(id(temp_quarto).state);'
          then:
            - lvgl.widget.update:
                id: grafico_temp
                series:
                  - id: serie_temp_quarto
                    add_value: !lambda 'return id(temp_quarto).state;'

# --- SENSORES INTERNOS (RECEBEM OS DADOS DO BLE ACIMA) ---
sensor:
  # Sensor 1: Sala
  - platform: template
    name: "Temperatura Sala"
    id: temp_sala
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    on_value:
      - lvgl.label.update:
          id: lbl_temp_sala
          text: !lambda 'return str_sprintf("%.1f °C", x);'

  - platform: template
    name: "Humidade Sala"
    id: hum_sala
    unit_of_measurement: "%"
    accuracy_decimals: 0
    on_value:
      - lvgl.label.update:
          id: lbl_hum_sala
          text: !lambda 'return str_sprintf("%.0f %%", x);'

  - platform: template
    name: "Bateria Sala"
    id: bat_sala
    unit_of_measurement: "%"
    accuracy_decimals: 0
    on_value:
      - lvgl.label.update:
          id: lbl_bat_sala
          text: !lambda 'return str_sprintf("Bat: %.0f%%", x);'

  # Sensor 2: Quarto
  - platform: template
    name: "Temperatura Quarto"
    id: temp_quarto
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    on_value:
      - lvgl.label.update:
          id: lbl_temp_quarto
          text: !lambda 'return str_sprintf("%.1f °C", x);'

  - platform: template
    name: "Humidade Quarto"
    id: hum_quarto
    unit_of_measurement: "%"
    accuracy_decimals: 0
    on_value:
      - lvgl.label.update:
          id: lbl_hum_quarto
          text: !lambda 'return str_sprintf("%.0f %%", x);'

  - platform: template
    name: "Bateria Quarto"
    id: bat_quarto
    unit_of_measurement: "%"
    accuracy_decimals: 0
    on_value:
      - lvgl.label.update:
          id: lbl_bat_quarto
          text: !lambda 'return str_sprintf("Bat: %.0f%%", x);'

# --- INTERFACE GRÁFICA LVGL (3 PÁGINAS TÁTEIS) ---
lvgl:
  displays:
    - meu_ecra
  touchscreens:
    - meu_toque
  theme:
    label:
      text_font: montserrat_20
  pages:
    # PÁGINA 1: DASHBOARD
    - id: pag_dashboard
      bg_color: 0x0F172A
      widgets:
        - label:
            x: 20
            y: 15
            text: "DASHBOARD SHELLY H&T"
            text_color: 0x38BDF8
            text_font: montserrat_24
        - button:
            x: 520
            y: 10
            width: 120
            height: 40
            on_click:
              - lvgl.page.show: pag_historico
            widgets:
              - label:
                  text: "Histórico"
                  align: CENTER
        - button:
            x: 655
            y: 10
            width: 125
            height: 40
            on_click:
              - lvgl.page.show: pag_config
            widgets:
              - label:
                  text: "Configurar"
                  align: CENTER

        # Cartão 1: Sala
        - obj:
            x: 20
            y: 75
            width: 370
            height: 380
            bg_color: 0x1E293B
            radius: 16
            widgets:
              - label:
                  x: 20
                  y: 20
                  text: "Sala de Estar"
                  text_color: 0xF8FAFC
                  text_font: montserrat_24
              - label:
                  id: lbl_temp_sala
                  x: 20
                  y: 90
                  text: "--.- °C"
                  text_color: 0x38BDF8
                  text_font: montserrat_48
              - label:
                  id: lbl_hum_sala
                  x: 20
                  y: 170
                  text: "-- %"
                  text_color: 0x2DD4BF
                  text_font: montserrat_36
              - label:
                  id: lbl_bat_sala
                  x: 20
                  y: 310
                  text: "Bat: --%"
                  text_color: 0x94A3B8

        # Cartão 2: Quarto
        - obj:
            x: 410
            y: 75
            width: 370
            height: 380
            bg_color: 0x1E293B
            radius: 16
            widgets:
              - label:
                  x: 20
                  y: 20
                  text: "Quarto"
                  text_color: 0xF8FAFC
                  text_font: montserrat_24
              - label:
                  id: lbl_temp_quarto
                  x: 20
                  y: 90
                  text: "--.- °C"
                  text_color: 0x38BDF8
                  text_font: montserrat_48
              - label:
                  id: lbl_hum_quarto
                  x: 20
                  y: 170
                  text: "-- %"
                  text_color: 0x2DD4BF
                  text_font: montserrat_36
              - label:
                  id: lbl_bat_quarto
                  x: 20
                  y: 310
                  text: "Bat: --%"
                  text_color: 0x94A3B8

    # PÁGINA 2: HISTÓRICO (GRÁFICO)
    - id: pag_historico
      bg_color: 0x0F172A
      widgets:
        - label:
            x: 20
            y: 15
            text: "HISTÓRICO TEMPERATURA (Azul: Sala | Verde: Quarto)"
            text_color: 0x38BDF8
            text_font: montserrat_20
        - button:
            x: 655
            y: 10
            width: 125
            height: 40
            on_click:
              - lvgl.page.show: pag_dashboard
            widgets:
              - label:
                  text: "Voltar"
                  align: CENTER
        - chart:
            id: grafico_temp
            x: 20
            y: 75
            width: 760
            height: 380
            type: LINE
            point_count: 96 # 96 pontos x 15 min = 24 horas na PSRAM
            min_value: 0
            max_value: 45
            series:
              - id: serie_temp_sala
                color: 0x38BDF8
                width: 3
              - id: serie_temp_quarto
                color: 0x2DD4BF
                width: 3

    # PÁGINA 3: CONFIGURAÇÃO
    - id: pag_config
      bg_color: 0x0F172A
      widgets:
        - label:
            x: 20
            y: 15
            text: "CONFIGURAÇÃO DO SISTEMA"
            text_color: 0x38BDF8
            text_font: montserrat_24
        - button:
            x: 655
            y: 10
            width: 125
            height: 40
            on_click:
              - lvgl.page.show: pag_dashboard
